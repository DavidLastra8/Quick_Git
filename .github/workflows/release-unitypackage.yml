# Builds QuickGit-<tag>.unitypackage and attaches it to the GitHub release.
# Runs automatically when a release is published; can also be run by hand from the
# Actions tab for an existing release (e.g. to rebuild the file).
name: Release .unitypackage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write # Needed to upload files to the release.

jobs:
  unitypackage:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build the .unitypackage
        run: |
          python3 .github/scripts/build_unitypackage.py \
            Assets/QuickGit "QuickGit-${TAG}.unitypackage" \
            --expect-version "${TAG#v}"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "QuickGit-${TAG}.unitypackage" --clobber
